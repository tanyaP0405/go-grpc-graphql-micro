scalar Time

type Account {
  id: ID!
  name: String!
  orders:[Order!]!
}
type Product {
  id: ID!
  name: String!
  description: String!
  price: Float!
}
type Order {
  id: ID!
  products: [OrderedProduct!]!
  totalPrice: Float!
  createdAt: Time!
}
type  OrderedProduct {
    id:String!
    name:String!
    description:String!
    price:Float!
    quantity: Int!
}
input PaginationInput {
  skip: Int!
  take: Int!
}
input AccountInput {
  name: String!
}
input ProductInput {
  name: String!
  description: String!
  price: Float!
}
input OrderProductInput {
  id: String!
  quantity: Int!
}
input OrderInput {
accountId: String!
  products: [OrderProductInput!]!
}
type Mutation {
  CreateAccount(account: AccountInput!): Account
  CreateProduct(product: ProductInput!): Product
  CreateOrder(order: OrderInput!): Order
}
type Query {
  accounts(pagination: PaginationInput,id: String): [Account!]!
  products(pagination: PaginationInput,query: String,id: String): [Product!]!
}